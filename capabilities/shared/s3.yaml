naftiko: "1.0.0-alpha1"
info:
  label: Amazon S3
  description: Shared capability definitions for Amazon S3 object storage operations.
  tags:
    - Cloud Storage
    - Object Storage
    - Buckets
  created: "2026-04-19"
  modified: "2026-04-19"
capability:
  exposes:
    - type: rest
      port: 8100
      namespace: s3-api
      resources:
        - label: List Buckets
          method: GET
          path: /
          operationId: ListBuckets
        - label: Create Bucket
          method: PUT
          path: /{Bucket}
          operationId: CreateBucket
        - label: Delete Bucket
          method: DELETE
          path: /{Bucket}
          operationId: DeleteBucket
        - label: List Objects
          method: GET
          path: /{Bucket}
          operationId: ListObjectsV2
        - label: Get Object
          method: GET
          path: /{Bucket}/{Key+}
          operationId: GetObject
        - label: Put Object
          method: PUT
          path: /{Bucket}/{Key+}
          operationId: PutObject
        - label: Delete Object
          method: DELETE
          path: /{Bucket}/{Key+}
          operationId: DeleteObject
        - label: Copy Object
          method: PUT
          path: /{Bucket}/{Key+}
          operationId: CopyObject
