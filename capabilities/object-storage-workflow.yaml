naftiko: "1.0.0-alpha1"
info:
  label: Amazon S3 Object Storage Workflow
  description: Workflow capability for managing Amazon S3 buckets and objects for scalable object storage.
  tags:
    - Cloud Storage
    - Object Storage
    - Data Management
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION
capability:
  consumes:
    - import: s3
      location: ./shared/s3.yaml
  exposes:
    - type: rest
      port: 8080
      namespace: workflow-api
      resources:
        - label: List Buckets
          method: GET
          path: /buckets
        - label: Create Bucket
          method: POST
          path: /buckets
        - label: Delete Bucket
          method: DELETE
          path: /buckets/{bucket}
        - label: List Objects
          method: GET
          path: /buckets/{bucket}/objects
        - label: Get Object
          method: GET
          path: /buckets/{bucket}/objects/{key}
        - label: Upload Object
          method: PUT
          path: /buckets/{bucket}/objects/{key}
        - label: Delete Object
          method: DELETE
          path: /buckets/{bucket}/objects/{key}
        - label: Copy Object
          method: POST
          path: /buckets/{bucket}/objects/{key}/copy
    - type: mcp
      port: 9090
      namespace: workflow-mcp
      transport: http
      tools:
        - name: list_buckets
          description: List all S3 buckets in the account
        - name: create_bucket
          description: Create a new S3 bucket
        - name: delete_bucket
          description: Delete an S3 bucket
        - name: list_objects
          description: List objects in an S3 bucket
        - name: get_object
          description: Download an object from S3
        - name: upload_object
          description: Upload an object to S3
        - name: delete_object
          description: Delete an object from S3
        - name: copy_object
          description: Copy an object within or between S3 buckets
